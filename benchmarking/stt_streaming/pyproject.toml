[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sttstream"
version = "0.1.0"
description = "Local realtime streaming STT with dual-pass refinement and benchmarking"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Codex"}]
license = {text = "MIT"}

dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "websockets>=12.0",
  "numpy>=1.23",
  "sounddevice>=0.4.6",
  "scipy>=1.10",
  "pydantic>=2.6",
  "rich>=13.7",
  "editdistance>=0.6.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0.3"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[project.scripts]
sttstream = "sttstream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
